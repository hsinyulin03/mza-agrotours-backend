name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This is the gate. Make THIS the required status check in branch protection.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Tests are skipped on purpose: the only test is BackendApplicationTests
      # (@SpringBootTest), which needs Postgres, Redis and a real Firebase
      # service-account file. Drop `-x test` once tests can run without them.
      - name: Compile and assemble
        run: ./gradlew build -x test

      - name: Upload boot jar
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

  # Advisory only. Never blocks a merge.
  sonar:
    name: SonarQube Cloud (advisory)
    needs: build
    runs-on: ubuntu-latest
    # Forks cannot read SONAR_TOKEN, so the scan would always fail there.
    if: github.event.pull_request.head.repo.fork != true
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar needs full history to attribute issues to "new code".
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check Sonar token is configured
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Analyse
        id: scan
        if: steps.token.outputs.configured == 'true'
        # The whole point: a failing quality gate reports, it does not block.
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # qualitygate.wait makes the scanner block until Sonar has computed the
        # gate, so its pass/fail lands in this run instead of only in the UI.
        run: ./gradlew sonar -Dsonar.qualitygate.wait=true

      - name: Summarise
        if: always()
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          CONFIGURED: ${{ steps.token.outputs.configured }}
        run: |
          {
            echo "## SonarQube Cloud"
            echo
            if [ "$CONFIGURED" != "true" ]; then
              echo ":grey_question: Skipped — the \`SONAR_TOKEN\` repository secret is not set."
            elif [ "$OUTCOME" = "success" ]; then
              echo ":white_check_mark: Quality gate passed."
            else
              echo ":warning: **Quality gate failed — this does not block the merge.**"
              echo
              echo "Review the findings before merging:"
              echo "https://sonarcloud.io/dashboard?id=hsinyulin03_mza-agrotours-backend"
            fi
          } >> "$GITHUB_STEP_SUMMARY"