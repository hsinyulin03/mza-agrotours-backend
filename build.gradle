plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.sonarqube' version '7.4.0.8496'
}

group = 'com.mza-agrotours'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.google.firebase:firebase-admin:9.9.0'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

}

tasks.named('test') {
	useJUnitPlatform()
	environment 'SPRING_PROFILES_ACTIVE', 'test'
	// The JDK resolves this machine's zone to the legacy alias "America/Buenos_Aires",
	// which pgjdbc sends to the server and postgres:16 rejects. Matches docker-compose.dev.yml.
	systemProperty 'user.timezone', 'America/Argentina/Buenos_Aires'
	testLogging {
		events "passed"
	}
	finalizedBy tasks.named('jacocoTestReport')
}

// Sonar reads coverage from the XML report, which is off by default.
tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}

sonar {
	properties {
		property 'sonar.host.url', 'https://sonarcloud.io'
		property 'sonar.projectKey', findProperty('sonarProjectKey') ?: 'hsinyulin03_mza-agrotours-backend'
		property 'sonar.organization', findProperty('sonarOrganization') ?: 'hsinyulin03'
		property 'sonar.projectName', 'mza-agrotours-backend'

		// Generated sources (MapStruct impls, Lombok output) are not ours to fix.
		property 'sonar.exclusions', 'build/generated/**'
		// Data holders and framework glue: no branches worth covering.
		property 'sonar.coverage.exclusions', [
				'**/BackendApplication.java',
				'**/config/**',
				'**/dtos/**',
				'**/entities/**',
				'**/enums/**',
				'**/mappers/**',
				'**/repositories/**',
		].join(',')
	}
}
