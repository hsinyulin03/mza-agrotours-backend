spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# FirebaseConfig is replaced by a mock in AbstractIntegrationTest, so no
# service-account file is read. The value only has to resolve.
google.application.credentials=unused-in-tests

object-storage.provider=local
object-storage.local-path=./build/test-uploads
object-storage.max-file-size=10485760