spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# FirebaseConfig is replaced by a mock in AbstractIntegrationTest, so no
# service-account file is read. The value only has to resolve.
google.application.credentials=unused-in-tests
mercado.access.token=unused-in-tests

object-storage.region=us-east-1
object-storage.bucket=mza-agrotours-test
object-storage.path-style-access=true
object-storage.presign-ttl=15m
object-storage.max-file-size=10485760

notificaciones.email.remitente=noreply@mendozaagrotours.com

openweather.api-key=unused-in-tests
spring.data.redis.host=unused-in-tests
