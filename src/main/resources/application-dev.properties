spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/backend}
spring.datasource.username=${DATASOURCE_USER:root_dev}
spring.datasource.password=${DATASOURCE_PASS:root_dev_pass}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

google.application.credentials=${GOOGLE_APPLICATION_CREDENTIALS}

firebase.database.url = ${FIREBASE_DATABASE_URL:https://mza-agrotours-dev-john-default-rtdb.firebaseio.com/}

mercado.access.token = ${ACCESS_TOKEN_MP}

object-storage.endpoint=${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
object-storage.region=${OBJECT_STORAGE_REGION:us-east-1}
object-storage.bucket=${OBJECT_STORAGE_BUCKET:mza-agrotours}
object-storage.access-key=${OBJECT_STORAGE_ACCESS_KEY:rustfsadmin}
object-storage.secret-key=${OBJECT_STORAGE_SECRET_KEY:rustfsadmin}
object-storage.path-style-access=true
object-storage.public-base-url=${OBJECT_STORAGE_PUBLIC_BASE_URL:http://localhost:9000/mza-agrotours}
object-storage.presign-ttl=15m
object-storage.max-file-size=10485760

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
notificaciones.email.remitente=noreply@mendozaagrotours.com
app.front.url=${FRONT_URL:http://localhost:3000}


openweather.api-key=${OPENWEATHER_API_KEY:}

# Clave AES-256 (32 bytes en Base64) para cifrar tokens de terceros (ej: OAuth de Mercado Pago)
cifrado.tokens.clave=${CIFRADO_TOKENS_CLAVE:afJwgIztvIxMzx2LHDEcBpaqwjXiFE4wvQbvrYi7yBU=}

# Mercado Pago OAuth: credenciales de producción de la aplicación del marketplace (Agrotours)
mercadopago.oauth.client-id=${MP_CLIENT_ID}
mercadopago.oauth.client-secret=${MP_CLIENT_SECRET}
# Tiene que coincidir exactamente con la "URL de redireccionamiento" cargada en la aplicación de MP
mercadopago.oauth.redirect-uri=${MP_OAUTH_REDIRECT_URI}
# Pantalla del front a la que vuelve el productor (recibe ?resultado=ok|cancelada|error&establecimientoId=...)
mercadopago.oauth.front-retorno-url=${MP_OAUTH_FRONT_RETORNO_URL:http://localhost:5173/mercadopago/vinculacion}
