spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/backend}
spring.datasource.username=${DATASOURCE_USER:root_dev}
spring.datasource.password=${DATASOURCE_PASS:root_dev_pass}

google.application.credentials=${GOOGLE_APPLICATION_CREDENTIALS}

mercado.access.token = ${ACCESS_TOKEN_MP}

object-storage.local-path=./uploads
object-storage.provider=local
object-storage.max-file-size=10485760

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true