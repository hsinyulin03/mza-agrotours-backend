spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/backend}
spring.datasource.username=${DATASOURCE_USER:root_dev}
spring.datasource.password=${DATASOURCE_PASS:root_dev_pass}

google.application.credentials=${GOOGLE_APPLICATION_CREDENTIALS}

mercado.access.token = ${ACCESS_TOKEN_MP}

object-storage.endpoint=${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
object-storage.region=${OBJECT_STORAGE_REGION:us-east-1}
object-storage.bucket=${OBJECT_STORAGE_BUCKET:mza-agrotours}
object-storage.access-key=${OBJECT_STORAGE_ACCESS_KEY:minioadmin}
object-storage.secret-key=${OBJECT_STORAGE_SECRET_KEY:minioadmin}
object-storage.path-style-access=true
object-storage.presign-ttl=15m
object-storage.max-file-size=10485760

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
notificaciones.email.remitente=noreply@mendozaagrotours.com

