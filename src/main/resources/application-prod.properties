spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USER}
spring.datasource.password=${DATASOURCE_PASS}

google.application.credentials=${GOOGLE_APPLICATION_CREDENTIALS}

object-storage.endpoint=${OBJECT_STORAGE_ENDPOINT:}
object-storage.region=${OBJECT_STORAGE_REGION}
object-storage.bucket=${OBJECT_STORAGE_BUCKET}
object-storage.access-key=${OBJECT_STORAGE_ACCESS_KEY}
object-storage.secret-key=${OBJECT_STORAGE_SECRET_KEY}
object-storage.path-style-access=${OBJECT_STORAGE_PATH_STYLE:false}
object-storage.presign-ttl=15m
object-storage.max-file-size=10485760

spring.jpa.hibernate.ddl-auto=validate

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
notificaciones.email.remitente=${MAIL_FROM}
