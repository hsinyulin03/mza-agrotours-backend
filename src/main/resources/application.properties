spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.datasource.driver-class-name=org.postgresql.Driver
# TODO: add Springboot Security credentials

openweather.base-url=https://api.openweathermap.org/data/2.5
openweather.timeout-ms=5000

# Mercado Pago - API y OAuth (vinculación de cuentas de vendedores)
mercadopago.api.base-url=https://api.mercadopago.com
mercadopago.api.timeout-ms=10000
mercadopago.oauth.auth-url=https://auth.mercadopago.com.ar/authorization

# Mercado Pago Checkout Pro: retorno del visitante y notificaciones de pago
mercadopago.checkout.back-url=${MP_CHECKOUT_BACK_URL:${app.front.url}/reservas/pago-resultado}
# Vacía: no hay webhook y los pagos de MP se confirman por polling (ReservaEstadosScheduler)
mercadopago.checkout.notification-url=${MP_WEBHOOK_URL:}
# Clave secreta de la sección Webhooks de la aplicación de MP; obligatoria si hay notification-url
mercadopago.checkout.webhook-secret=${MP_WEBHOOK_SECRET:}
