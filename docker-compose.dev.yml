services:
  db:
    image: postgres:16.14
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root_dev
      POSTGRES_PASSWORD: root_dev_pass
      POSTGRES_DB: mza-agrotours-bd
      TZ: America/Argentina/Buenos_Aires
      PGTZ: America/Argentina/Buenos_Aires
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2.6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    environment:
      - REDIS_ARGS=--requirepass root_dev_pass --appendonly yes
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      TZ: America/Argentina/Buenos_Aires
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpitdata:/data

  # TODO: Añadir Redis al implementar módulo actividades

volumes:
  pgdata:
  mailpitdata:
  redis-data:
    driver: local