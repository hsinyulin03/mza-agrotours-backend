services:
  db:
    image: postgres:16.14
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root_dev
      POSTGRES_PASSWORD: root_dev_pass
      POSTGRES_DB: mza-agrotours-bd
      TZ: America/Argentina/Buenos_Aires
      PGTZ: America/Argentina/Buenos_Aires
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2.6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    environment:
      - REDIS_ARGS=--requirepass root_dev_pass --appendonly yes
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      TZ: America/Argentina/Buenos_Aires
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpitdata:/data

  # MinIO ya no se publica en Docker Hub: las imagenes viven en quay.io.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # El navegador sube directo al bucket, asi que el preflight lo responde MinIO.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mza-agrotours &&
      mc anonymous set none local/mza-agrotours &&
      mc anonymous set download local/mza-agrotours/establecimientos &&
      mc anonymous set download local/mza-agrotours/actividades &&
      mc anonymous set download local/mza-agrotours/cultivos &&
      mc anonymous set download local/mza-agrotours/recetas
      "

  # TODO: Añadir Redis al implementar módulo actividades

volumes:
  pgdata:
  mailpitdata:
  redis-data:
    driver: local
  miniodata: