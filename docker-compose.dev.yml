services:
  db:
    image: postgres:16.14
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root_dev
      POSTGRES_PASSWORD: root_dev_pass
      POSTGRES_DB: mza-agrotours-bd
      TZ: America/Argentina/Buenos_Aires
      PGTZ: America/Argentina/Buenos_Aires
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2.6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    environment:
      - REDIS_ARGS=--requirepass root_dev_pass --appendonly yes
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      TZ: America/Argentina/Buenos_Aires
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpitdata:/data

  rustfs:
    image: rustfs/rustfs:1.0.0
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
      # El navegador sube directo al bucket, asi que el preflight lo responde RustFS.
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - rustfsdata:/data

  # Misma policy que genera ObjectStoragePolicies.lecturaPublica.
  rustfs-init:
    image: amazon/aws-cli:2.37.4
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
    entrypoint: >
      /bin/sh -c "
      until aws s3api list-buckets > /dev/null 2>&1; do sleep 2; done &&
      (aws s3api head-bucket --bucket mza-agrotours 2>/dev/null || aws s3api create-bucket --bucket mza-agrotours) &&
      aws s3api put-bucket-policy --bucket mza-agrotours --policy '{
        \"Version\": \"2012-10-17\",
        \"Statement\": [{
          \"Sid\": \"LecturaPublicaDeCarpetasPublicas\",
          \"Effect\": \"Allow\",
          \"Principal\": {\"AWS\": [\"*\"]},
          \"Action\": [\"s3:GetObject\"],
          \"Resource\": [
            \"arn:aws:s3:::mza-agrotours/establecimientos/*\",
            \"arn:aws:s3:::mza-agrotours/actividades/*\",
            \"arn:aws:s3:::mza-agrotours/cultivos/*\",
            \"arn:aws:s3:::mza-agrotours/recetas/*\"
          ]
        }]
      }'
      "

  # TODO: Añadir Redis al implementar módulo actividades

volumes:
  pgdata:
  mailpitdata:
  redis-data:
    driver: local
  rustfsdata: